services:
  postgres:
    image: postgres:16-alpine
    container_name: gemivora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: gemivora_cms
    ports:
      - "5433:5432"
    volumes:
      - gemivora_pg_data:/var/lib/postgresql/data

volumes:
  gemivora_pg_data:
